<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day Out Map</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f7a5c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Full-screen Google map; a floating filter bar on top and a details card that slides up from the bottom */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --ink:#15302a; --muted:#5b6e68; --line:#d6e0dc; --chip:#e6eeea;
  --accent:#0f7a5c; --accent-ink:#ffffff; --sun:#f2b33d; --sun-soft:#fff3d6; --sun-ink:#6a4a05; --warn:#a4570e; --warn-soft:#fdf0e1;
  --pin-p:#0f7a5c; --pin-o:#7a3fb0; --pin-e:#c4501f; --pin-t:#1a73e8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1715; --surface:#17221f; --ink:#e3eeea; --muted:#94a8a1; --line:#2a3a35; --chip:#22302c;
  --accent:#3fbf93; --accent-ink:#06231a; --sun-soft:#3a2e12; --sun-ink:#ffd98a; --warn:#f0a65c; --warn-soft:#3a2a17; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);overflow:hidden}
#map{position:fixed!important;inset:0;width:100%;height:100%}
.top{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:grid;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:760px;width:100%;justify-self:center}
.brow{display:flex;align-items:center;gap:8px}
.bar .trip{background:none;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;padding:8px 0 0;margin-top:8px;max-width:none;max-height:40vh}
.bar h1{font:800 19px/1 var(--f-display);margin:0;letter-spacing:-.01em;white-space:nowrap}
.bar .count{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;max-width:760px;width:100%;justify-self:center;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
button,select,a.btn{font:inherit}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select.chip{appearance:none;padding-right:13px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink);padding:5px 10px;border-radius:8px;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fab{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:grid;gap:8px}
.fab button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer}
.card{position:fixed;z-index:6;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;max-height:62vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.2);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.card h2{font:600 21px/1.2 var(--f-display);margin:0;text-wrap:balance;padding-right:70px}
.card .x{position:absolute;right:12px;top:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.card p{margin:0}
.check{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:7px 12px;font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{display:inline-flex;align-items:center;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list{display:grid;gap:6px}
.list button{display:grid;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.list small{color:var(--muted)}
.msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.toast{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px;font-size:14px}
.trip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:760px;width:100%;justify-self:center;display:grid;gap:8px;max-height:42vh;overflow-y:auto}
.trip .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.trip label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.legend{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 34px);display:grid;gap:6px;justify-items:start}
.legend>button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer}
.lgd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 2px 12px rgba(0,0,0,.22);display:grid;gap:2px;max-height:55vh;overflow-y:auto}
.lgd h4{margin:6px 6px 2px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.lgd button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);padding:6px 8px;border-radius:8px;font-size:14px;text-align:left;cursor:pointer}
.lgd button[aria-pressed="true"]{background:var(--chip);font-weight:600}
.lgd i{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.lgd i.ev{border-radius:4px}
.lgd small{color:var(--muted);padding:4px 8px 2px;font-size:12.5px}
.gdata{display:grid;gap:4px;font-size:14px}
.gdata:empty{display:none}
.gdata .open{color:var(--accent);font-weight:600}.gdata .shut{color:var(--warn);font-weight:600}
.gdata .star{color:#e0a106}
.gdata small{color:var(--muted)}
.destbox{position:relative;flex:1 1 180px;min-width:0}
.destbox input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%}
.sugg{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:9;max-height:240px;overflow-y:auto}
.sugg li{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;display:grid}
.sugg li small{color:var(--muted)}
.sugg li:hover,.sugg li.on{background:var(--chip)}
.trip select#detour{flex:0 0 auto}.trip select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0;flex:1 1 120px}
.trip .hint{font-size:13.5px;color:var(--muted)}
.stops{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.stops li{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:5px 6px 5px 10px;font-size:14px}
.stops li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stops small{color:var(--muted);font-variant-numeric:tabular-nums}
.stops button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="map"><div class="msg" id="msg">Loading the map…</div></div>

<div class="top">
  <div class="bar">
   <div class="brow">
    <h1>Day Out</h1>
    <div class="seg" role="group" aria-label="Show">
      <button type="button" data-layer="both" aria-pressed="true">Both</button>
      <button type="button" data-layer="p" aria-pressed="false">Places</button>
      <button type="button" data-layer="e" aria-pressed="false">Events</button>
    </div>
    <span class="count" id="count"></span>
   </div>
  <section class="trip" id="trip" hidden aria-label="Trip planner">
    <div class="row"><label for="dest">To</label><div class="destbox"><input id="dest" type="search" placeholder="Heading to…" autocomplete="off" enterkeyhint="go"><ul class="sugg" id="sugg" hidden></ul></div>
      <select id="detour" aria-label="Detour distance" title="Max detour" style="flex:0 0 auto"><option value="5">±5 mi</option><option value="15" selected>±15 mi</option><option value="30">±30 mi</option><option value="50">±50 mi</option></select></div>
    <div class="hint" id="tripHint"></div>
    <ol class="stops" id="stops"></ol>
    <div class="row" id="tripActs" hidden><a class="btn primary" id="tripGo" target="_blank" rel="noopener" href="#">Open route in Google Maps</a><button type="button" class="btn" id="tripClear">Clear stops</button></div>
  </section>
  </div>
  <div class="chips" role="group" aria-label="Filters">
    <button type="button" class="chip" id="tripBtn" aria-pressed="false">Plan a trip</button>
    <select class="chip" id="when" aria-label="When (events)">
      <option value="0">Today</option><option value="wk">This weekend</option><option value="7">Next 7 days</option>
      <option value="30" selected>Next 30 days</option><option value="90">Next 3 months</option>
    </select>
    <button type="button" class="chip" id="fFree" aria-pressed="false">Free</button>
    <select class="chip" id="cat" aria-label="Kind">
      <option value="">Any kind</option><option value="museum">Museums &amp; history</option><option value="art">Art</option><option value="science">Science &amp; kids</option>
      <option value="zoo">Zoos</option><option value="nature">Nature &amp; trails</option><option value="fun">Fun &amp; nightlife</option><option value="oddity">Roadside oddities</option>
      <option value="music">Music (events)</option><option value="sports">Sports (events)</option><option value="arts">Theater &amp; film (events)</option><option value="holiday">Holiday (events)</option><option value="family">Family &amp; community (events)</option>
    </select>
    <select class="chip" id="drive" aria-label="Drive">
      <option value="9999">Any distance</option><option value="30">Within 30 min</option><option value="60">Within 1 hr</option><option value="120">Within 2 hrs</option><option value="240">Within 4 hrs</option>
    </select>
  </div>
</div>

<div class="fab"><button type="button" id="nearMe">Near me</button><button type="button" id="home">Home</button><button type="button" id="fit">Fit all</button></div>
<section class="card" id="card" hidden aria-live="polite"></section>
<div class="legend"><div class="lgd" id="lgd" hidden></div><button type="button" id="lgdBtn" aria-expanded="false">Legend</button></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
const APP_URL="https://claude.ai/artifact/7hKJXpDmDRqijqihZ7FiLG";
const HOME={name:"Evansville",lat:37.9716,lon:-87.5711};
const CATS={oddity:["oddity"],museum:["museum","history","library"],art:["art"],science:["science","children"],zoo:["zoo"],nature:["nature","trail","park"],fun:["neighborhood","sports","amusement","music"]};
const ECATS={music:["music"],sports:["sports","fitness"],arts:["arts","film"],holiday:["holiday"],family:["family","community","learning","food","market"]};
const MOODS={social:"Social",solo_friendly:"OK alone",relaxing:"Relaxing",calming:"Calming",exercise:"Exercise",date_day:"Date day",outdoors:"Outdoors",indoors:"Indoors",quiet:"Quiet",loud:"Loud & lively",easy:"Easy",strenuous:"Strenuous"};
const TIER={free:"Free","$":"$","$$":"$$","$$$":"$$$"};
const CITIES = [
 ["Evansville, IN",37.9716,-87.5711],["Newburgh, IN",37.9445,-87.405],["Boonville, IN",38.0492,-87.2742],["Mt. Vernon, IN",37.9323,-87.8953],
 ["Princeton, IN",38.3553,-87.5675],["Vincennes, IN",38.6773,-87.5286],["Jasper, IN",38.3914,-86.931],["Tell City, IN",37.9514,-86.7678],
 ["Santa Claus, IN",38.12,-86.914],["New Harmony, IN",38.1298,-87.9353],["Terre Haute, IN",39.4667,-87.4139],["Bloomington, IN",39.1653,-86.5264],
 ["Indianapolis, IN",39.7684,-86.1581],["Columbus, IN",39.2014,-85.9214],["New Albany, IN",38.2856,-85.8241],["Lafayette, IN",40.4167,-86.8753],
 ["Henderson, KY",37.8362,-87.5900],["Owensboro, KY",37.7719,-87.1112],["Madisonville, KY",37.3281,-87.4989],["Paducah, KY",37.0834,-88.6000],
 ["Bowling Green, KY",36.9685,-86.4808],["Louisville, KY",38.2527,-85.7585],["Lexington, KY",38.0406,-84.5037],["Cadiz, KY",36.8651,-87.8353],
 ["Mammoth Cave, KY",37.1870,-86.1],["Carbondale, IL",37.7273,-89.2168],["Mt. Vernon, IL",38.3173,-88.9031],["Harrisburg, IL",37.7384,-88.5406],
 ["Springfield, IL",39.7817,-89.6501],["Chicago, IL",41.8781,-87.6298],["St. Louis, MO",38.627,-90.1994],["Kansas City, MO",39.0997,-94.5786],
 ["Nashville, TN",36.1627,-86.7816],["Clarksville, TN",36.5298,-87.3595],["Murfreesboro, TN",35.8456,-86.3903],["Memphis, TN",35.1495,-90.049],
 ["Chattanooga, TN",35.0456,-85.3097],["Knoxville, TN",35.9606,-83.9207],["Gatlinburg, TN",35.7143,-83.5102],["Cincinnati, OH",39.1031,-84.512],
 ["Columbus, OH",39.9612,-82.9988],["Dayton, OH",39.7589,-84.1916]
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0"),dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const S={trip:false,dest:null,stops:[],path:null,routeMi:null,routeMin:null,layer:"both",free:false,origin:HOME,sel:null};
let PLACES=[],EVENTS=[],EVUPD=null,map,info,markers=[],clusterer=null,ITEMS=[];
function miles(a,b){const R=3958.8,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function driveMin(d){const r=d*1.25;return Math.round(r/(d<15?30:55)*60)+5;}
function fmtMin(n){if(n<60)return n+" min";const h=Math.floor(n/60),m=n%60;return h+" hr"+(m?" "+m+" min":"");}
function windowRange(){const t=new Date();t.setHours(0,0,0,0);const v=$("when").value;
  if(v==="wk"){const d=t.getDay(),s=new Date(t);if(d!==6&&d!==0)s.setDate(t.getDate()+(5-d));const e=new Date(s);e.setDate(s.getDate()+(s.getDay()===5?2:s.getDay()===6?1:0));return [s,e];}
  const e=new Date(t);e.setDate(t.getDate()+(+v));return [t,e];}
function nextDate(e,from,to){const f=dstr(from),t=dstr(to);
  if(Array.isArray(e.shows)&&e.shows.length){const s=e.shows.map(x=>x.slice(0,10)).sort().find(d=>d>=f&&d<=t);return s?{date:s,time:(e.shows.find(x=>x.startsWith(s))||"").slice(11)||e.time}:null;}
  const end=e.end_date||e.date;if(end<f||e.date>t)return null;return {date:e.date<f?f:e.date,time:e.time};}
function priceTxt(e){if(e.is_free||e.price_max===0)return "Free";if(e.price_min==null)return "Price not listed";
  return "$"+e.price_min+(e.price_max&&e.price_max!==e.price_min?"–$"+e.price_max:"")+(e.price_estimated?" (est.)":"");}
function niceDate(d,t){const x=new Date(d+"T"+(t||"12:00"));return x.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})+(t?" · "+x.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}):"");}

function routePath(){return S.path&&S.path.length>1?S.path:[S.origin,S.dest];}
function offRoute(pt){// miles off the route (road route when Google gives one, else a straight line), and miles along it
  const P=routePath(),k=Math.cos(pt.lat*Math.PI/180)*69.17,px=pt.lon*k,py=pt.lat*69.05;let best=1e9,along=0,run=0;
  for(let i=0;i<P.length-1;i++){const ax=P[i].lon*k,ay=P[i].lat*69.05,bx=P[i+1].lon*k,by=P[i+1].lat*69.05,dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1e-9,L=Math.sqrt(L2);
    let t=((px-ax)*dx+(py-ay)*dy)/L2;t=Math.max(0,Math.min(1,t));const d=Math.hypot(px-(ax+t*dx),py-(ay+t*dy));if(d<best){best=d;along=run+t*L;}run+=L;}
  return {off:best,along:S.path?along:along*1.25};}
let routeSeq=0;
async function findRoute(){S.path=null;S.routeMi=null;S.routeMin=null;if(!map||!S.trip||!S.dest)return;const seq=++routeSeq,o={lat:S.origin.lat,lng:S.origin.lon},d={lat:S.dest.lat,lng:S.dest.lon};let path=null,mi=null,min=null;
  try{const {Route}=await google.maps.importLibrary("routes");if(Route&&Route.computeRoutes){const r=await Route.computeRoutes({origin:o,destination:d,travelMode:"DRIVING",fields:["path","distanceMeters","durationMillis"]});
      const rt=r.routes&&r.routes[0];if(rt&&rt.path&&rt.path.length>1){path=rt.path.map(p=>({lat:typeof p.lat==="function"?p.lat():p.lat,lon:typeof p.lng==="function"?p.lng():p.lng}));mi=rt.distanceMeters/1609.34;min=rt.durationMillis?rt.durationMillis/60000:null;}}}catch(_){}
  if(!path){try{const r=await new google.maps.DirectionsService().route({origin:o,destination:d,travelMode:"DRIVING"});const rt=r.routes[0];
      path=rt.overview_path.map(p=>({lat:p.lat(),lon:p.lng()}));mi=rt.legs.reduce((n,l)=>n+l.distance.value,0)/1609.34;min=rt.legs.reduce((n,l)=>n+l.duration.value,0)/60;}catch(_){}}
  if(seq!==routeSeq)return;if(path){if(path.length>400){const st=Math.ceil(path.length/400);path=path.filter((p,i)=>i%st===0||i===path.length-1);}S.path=path;S.routeMi=mi;S.routeMin=min;draw(true);}}
function allItems(){const o=[];PLACES.forEach(p=>o.push({k:p.category==="oddity"?"o":"p",id:p.id,lat:p.lat,lon:p.lon,title:p.name,p}));
  const t=new Date();t.setHours(0,0,0,0);const far=new Date(t);far.setDate(t.getDate()+90);
  EVENTS.forEach(e=>{if(e.lat==null)return;const oc=nextDate(e,t,far);if(oc)o.push({k:"e",id:"e-"+e.id,lat:e.lat,lon:e.lon,title:e.title,e,o:oc});});return o;}
function tripStops(){if(!S.dest)return [];const all=allItems();return S.stops.map(id=>all.find(x=>x.id===id)).filter(Boolean).map(it=>{const r=offRoute(it);it.off=r.off;it.along=r.along;it.d=miles(S.origin,it);it.dm=driveMin(it.d);return it;}).sort((a,b)=>a.along-b.along);}
function compute(){const out0=computeAll();if(!S.trip||!S.dest)return out0;const w=+$("detour").value;
  return out0.filter(it=>{const r=offRoute(it);it.off=r.off;it.along=r.along;return (r.off<=w&&miles(S.origin,it)>5)||S.stops.includes(it.id);}).sort((a,b)=>a.along-b.along);}
function computeAll(){const out=[],cat=$("cat").value,maxD=S.trip&&S.dest?99999:+$("drive").value;
  if(S.layer!=="e")PLACES.forEach(p=>{
    if(S.free&&p.cost_tier!=="free")return;

let meMarker=null;
$("nearMe").onclick=()=>{if(!navigator.geolocation){toast("Location isn't available in this browser.");return;}toast("Finding you…");
  navigator.geolocation.getCurrentPosition(pos=>{S.origin={name:"you",lat:pos.coords.latitude,lon:pos.coords.longitude};
    if(map){meMarker&&meMarker.setMap(null);meMarker=new google.maps.Marker({map,position:{lat:S.origin.lat,lng:S.origin.lon},title:"You are here",icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:"#1a73e8",fillOpacity:1,strokeColor:"#fff",strokeWeight:3},zIndex:999});
      map.panTo({lat:S.origin.lat,lng:S.origin.lon});map.setZoom(11);}
    S.path=null;draw(false);findRoute();toast("Distances from where you are now");},
    ()=>toast("Couldn't get your location. Check the browser's location permission."),{enableHighAccuracy:false,timeout:10000});};

window.initMap=function(){
  map=new google.maps.Map($("map"),{center:{lat:HOME.lat,lng:HOME.lon},zoom:8,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,clickableIcons:true,
    gestureHandling:"greedy",colorScheme:matchMedia("(prefers-color-scheme: dark)").matches?"DARK":"LIGHT"});
  new google.maps.Marker({map,position:{lat:HOME.lat,lng:HOME.lon},title:"Home: Evansville",icon:{path:google.maps.SymbolPath.CIRCLE,scale:6,fillColor:"#15302a",fillOpacity:1,strokeColor:"#fff",strokeWeight:2}});
  map.addListener("click",()=>{$("card").hidden=true;});
  draw(true);};
window.gm_authFailure=function(){$("map").innerHTML='<div class="msg">Google refused the map key. Check that the key allows this website address and the Maps JavaScript API.</div>';};

(async()=>{
  try{const [p,e]=await Promise.all([fetch("data/places.json",{cache:"no-cache"}).then(r=>r.json()),fetch("data/events.json",{cache:"no-cache"}).then(r=>r.json())]);
    PLACES=p.places||[];EVENTS=e.items||[];EVUPD=e.updated;}catch(_){toast("Couldn't load the list of places and events.");}
  draw(false);
  const key=(window.DOF_CONFIG||{}).mapsKey;
  if(!key||/PASTE/.test(key)){$("msg").textContent="The Google Maps key hasn't been added yet.";return;}
  const s=document.createElement("script");s.async=true;
  s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(key)+"&v=weekly&loading=async&callback=initMap";
  s.onerror=()=>{$("msg").textContent="Google Maps couldn't load. Check your connection.";};document.head.appendChild(s);
  const c=document.createElement("script");c.src="https://unpkg.com/@googlemaps/markerclusterer@2.5.3/dist/index.min.js";c.async=true;c.onload=()=>{if(map)draw(false);};document.head.appendChild(c);
})();
</script>
</body>
</html>
